{% extends 'base.html' %}
{% block title %}404 Not Found | CertifyCloud{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="card card-custom p-5 mx-auto" style="max-width: 600px;">
        <h1 class="display-1 text-warning fw-bold">404</h1>
        <h3 class="text-light mb-3">Page Not Found</h3>
        <p class="text-muted mb-4">The requested page or resource could not be located on the server.</p>
        <a href="{% url 'home' %}" class="btn btn-gold px-4">
            <i class="bi bi-house-door me-2"></i> Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
