{% extends 'base.html' %}
{% block title %}500 Server Error | CertifyCloud{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="card card-custom p-5 mx-auto" style="max-width: 600px;">
        <h1 class="display-1 text-danger fw-bold">500</h1>
        <h3 class="text-light mb-3">Internal Server Error</h3>
        <p class="text-muted mb-4">An unexpected error occurred on the server. Our system logs have recorded this incident.</p>
        <a href="{% url 'home' %}" class="btn btn-gold px-4">
            <i class="bi bi-house-door me-2"></i> Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
